name: CD

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      image_tag:
        description: 'Existing SHA-run image tag to redeploy; empty builds this ref.'
        default: ''
        required: false
      rollback_drill:
        description: 'Verify previous release, then restore and verify the new release.'
        type: boolean
        default: false

concurrency:
  group: swe5001-cloud-deployment
  cancel-in-progress: false
permissions:
  contents: read

jobs:
  resolve:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    outputs:
      revision: ${{ steps.release.outputs.revision }}
      tag: ${{ steps.release.outputs.tag }}
      build: ${{ steps.release.outputs.build }}
      client: ${{ steps.release.outputs.client }}
      tenant: ${{ steps.release.outputs.tenant }}
      subscription: ${{ steps.release.outputs.subscription }}
      registry: ${{ steps.release.outputs.registry }}
      registry_name: ${{ steps.release.outputs.registry_name }}
      group: ${{ steps.release.outputs.group }}
      vm: ${{ steps.release.outputs.vm }}
      host: ${{ steps.release.outputs.host }}
    steps:
      - uses: actions/checkout@v4
      - name: Resolve exact source and image version
        id: release
        env:
          HEAD_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
          INPUT_TAG: ${{ inputs.image_tag }}
          RUN_ID: ${{ github.run_id }}
        run: |
          python3 - <<'PY'
          import json, os, re
          target = json.load(open('deploy/presentation/azure-target.json'))
          tag = os.environ['INPUT_TAG']
          sha = tag.rsplit('-', 1)[0] if tag else os.environ['HEAD_SHA']
          tag = tag or sha + '-' + os.environ['RUN_ID']
          assert re.fullmatch('[a-f0-9]{40}', sha)
          assert re.fullmatch('[a-f0-9]{40}-[0-9]+', tag)
          fields = dict(revision=sha, tag=tag, build=str(not bool(os.environ['INPUT_TAG'])).lower(),
                        client=target['clientId'], tenant=target['tenantId'], subscription=target['subscriptionId'],
                        registry=target['registry'], registry_name=target['registryName'],
                        group=target['resourceGroup'], vm=target['vmName'], host=target['publicHost'])
          with open(os.environ['GITHUB_OUTPUT'], 'a') as stream:
              for key, value in fields.items(): stream.write(f'{key}={value}\n')
          PY

  images:
    needs: resolve
    if: needs.resolve.outputs.build == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - {service: identity, context: services/identity/JiKeDa.Identity.Api, file: services/identity/JiKeDa.Identity.Api/Dockerfile}
          - {service: catalog, context: services/catalog/JiKeDa.Catalog.Api, file: services/catalog/JiKeDa.Catalog.Api/Dockerfile}
          - {service: order, context: services/order/JiKeDa.Order.Api, file: services/order/JiKeDa.Order.Api/Dockerfile}
          - {service: fulfilment, context: services/fulfilment/JiKeDa.Fulfilment.Api, file: services/fulfilment/JiKeDa.Fulfilment.Api/Dockerfile}
          - {service: gateway, context: gateway/JiKeDa.Gateway, file: gateway/JiKeDa.Gateway/Dockerfile}
          - {service: frontend, context: frontend, file: frontend/Dockerfile}
          - {service: database, context: ., file: deploy/presentation/Database.Dockerfile}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.resolve.outputs.revision }}
      - uses: docker/setup-buildx-action@v3
      - uses: azure/login@v2
        with:
          client-id: ${{ needs.resolve.outputs.client }}
          tenant-id: ${{ needs.resolve.outputs.tenant }}
          subscription-id: ${{ needs.resolve.outputs.subscription }}
      - name: Login to registry using short-lived OIDC credentials
        env:
          REGISTRY_NAME: ${{ needs.resolve.outputs.registry_name }}
        run: az acr login --name "$REGISTRY_NAME"
      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          load: true
          tags: ${{ needs.resolve.outputs.registry }}/${{ matrix.service }}:${{ needs.resolve.outputs.tag }}
          labels: org.opencontainers.image.revision=${{ needs.resolve.outputs.revision }}
          build-args: |
            API_UPSTREAM=gateway
            VITE_ENABLE_TEST_PAYMENT=true
          cache-from: type=gha,scope=platform-${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=platform-${{ matrix.service }}
      - name: Block fixable High and Critical image findings
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25
        with:
          image-ref: ${{ needs.resolve.outputs.registry }}/${{ matrix.service }}:${{ needs.resolve.outputs.tag }}
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '1'
      - name: Retain full findings, including upstream-unfixed advisories
        if: always()
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25
        with:
          image-ref: ${{ needs.resolve.outputs.registry }}/${{ matrix.service }}:${{ needs.resolve.outputs.tag }}
          severity: HIGH,CRITICAL
          ignore-unfixed: false
          exit-code: '0'
          format: json
          output: scan-${{ matrix.service }}.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: image-security-${{ matrix.service }}
          path: scan-${{ matrix.service }}.json
      - name: Publish verified release image
        env:
          IMAGE: ${{ needs.resolve.outputs.registry }}/${{ matrix.service }}:${{ needs.resolve.outputs.tag }}
        run: docker push "$IMAGE"

  deploy:
    needs: [resolve, images]
    if: always() && needs.resolve.result == 'success' && (needs.images.result == 'success' || needs.images.result == 'skipped')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.resolve.outputs.revision }}
      - uses: azure/login@v2
        with:
          client-id: ${{ needs.resolve.outputs.client }}
          tenant-id: ${{ needs.resolve.outputs.tenant }}
          subscription-id: ${{ needs.resolve.outputs.subscription }}
      - name: Generate bootstrap for the exact commit
        env:
          REVISION: ${{ needs.resolve.outputs.revision }}
          IMAGE_TAG: ${{ needs.resolve.outputs.tag }}
        run: python3 scripts/presentation/bootstrap.py --revision "$REVISION" --image-tag "$IMAGE_TAG" > /tmp/deploy.sh
      - name: Deploy, migrate once, verify; restore previous app on failure
        env:
          RESOURCE_GROUP: ${{ needs.resolve.outputs.group }}
          VM_NAME: ${{ needs.resolve.outputs.vm }}
          IMAGE_TAG: ${{ needs.resolve.outputs.tag }}
        run: |
          az vm run-command invoke --resource-group "$RESOURCE_GROUP" --name "$VM_NAME" --command-id RunShellScript --scripts @/tmp/deploy.sh > /tmp/deploy-result.json
          python3 - <<'PY'
          import json, os
          data = json.load(open('/tmp/deploy-result.json'))
          message = '\n'.join(v.get('message','') for v in data.get('value',[]))
          print(message)
          assert 'DEPLOYMENT_OK ' + os.environ['IMAGE_TAG'] in message, 'Deployment did not confirm success'
          PY
      - name: Verify public HTTPS
        env:
          PUBLIC_HOST: ${{ needs.resolve.outputs.host }}
        run: |
          curl --fail --retry 5 --retry-delay 3 "https://$PUBLIC_HOST/api/health"
          curl --fail "https://$PUBLIC_HOST/api/merchants/1/dishes" > /dev/null
      - name: Exercise rollback and restore current version
        if: inputs.rollback_drill == true
        env:
          RESOURCE_GROUP: ${{ needs.resolve.outputs.group }}
          VM_NAME: ${{ needs.resolve.outputs.vm }}
          IMAGE_TAG: ${{ needs.resolve.outputs.tag }}
          REVISION: ${{ needs.resolve.outputs.revision }}
        run: |
          python3 scripts/presentation/bootstrap.py --operation rollback --revision "$REVISION" --image-tag "$IMAGE_TAG" > /tmp/rollback.sh
          az vm run-command invoke --resource-group "$RESOURCE_GROUP" --name "$VM_NAME" --command-id RunShellScript --scripts @/tmp/rollback.sh > /tmp/rollback-result.json
          python3 - <<'PY'
          import json
          data=json.load(open('/tmp/rollback-result.json'))
          message='\n'.join(v.get('message','') for v in data.get('value',[]))
          print(message)
          assert 'ROLLBACK_DRILL_OK ' in message
          PY
      - name: Record deployed source and artifact version
        env:
          SOURCE: ${{ needs.resolve.outputs.revision }}
          IMAGE_TAG: ${{ needs.resolve.outputs.tag }}
          PUBLIC_HOST: ${{ needs.resolve.outputs.host }}
        run: |
          echo "Source: $SOURCE" >> "$GITHUB_STEP_SUMMARY"
          echo "Image version: $IMAGE_TAG" >> "$GITHUB_STEP_SUMMARY"
          echo "Application: https://$PUBLIC_HOST" >> "$GITHUB_STEP_SUMMARY"
          echo "Live Grafana: https://$PUBLIC_HOST/grafana/" >> "$GITHUB_STEP_SUMMARY"
