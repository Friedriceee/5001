resolver 127.0.0.11 valid=2s ipv6=off;
upstream catalog_replicas {
    zone catalog_replicas 64k;
    server catalog:8080 resolve max_fails=1 fail_timeout=2s;
    keepalive 32;
}
server {
    listen 8080;
    location / {
        proxy_pass http://catalog_replicas;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Correlation-ID $http_x_correlation_id;
        proxy_connect_timeout 2s;
        proxy_next_upstream error timeout http_502 http_503 http_504;
        proxy_next_upstream_tries 2;
        add_header X-Catalog-Instance $upstream_addr always;
    }
}
server {
    listen 8081;
    access_log off;
    location = /status { stub_status; }
    location / { return 404; }
}
