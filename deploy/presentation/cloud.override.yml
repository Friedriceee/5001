# Budget Azure deployment: SHA-tagged application images, private service ports, real metric-driven scaling.
name: jikeda5001-cloud
x-env: &env
  ASPNETCORE_ENVIRONMENT: Production
  Jwt__Key: ${JWT_KEY:?}
  Jwt__Issuer: JiKeDa
  Jwt__Audience: JiKeDa.Client
  Database__MigrateOnStartup: "false"
  APPLICATIONINSIGHTS_CONNECTION_STRING: ${APPLICATIONINSIGHTS_CONNECTION_STRING:-}
x-runtime: &runtime
  restart: unless-stopped
  mem_limit: 512m
  logging: &logging
    driver: json-file
    options: {max-size: 10m, max-file: '3'}
services:
  foundation-db:
    image: ${REGISTRY:?}/database:${IMAGE_TAG:?}
    restart: unless-stopped
    mem_limit: 384m
    logging: *logging
    environment:
      POSTGRES_PASSWORD: ${DB_ADMIN_PASSWORD:?}
      IDENTITY_DB_PASSWORD: ${IDENTITY_DB_PASSWORD:?}
      CATALOG_DB_PASSWORD: ${CATALOG_DB_PASSWORD:?}
      ORDER_DB_PASSWORD: ${ORDER_DB_PASSWORD:?}
      FULFILMENT_DB_PASSWORD: ${FULFILMENT_DB_PASSWORD:?}
    ports: !reset []
    volumes: !override
      - microservices-pgdata:/var/lib/postgresql/data
      - ${RELEASE_DIR:?}/deploy/presentation/init-databases.sh:/docker-entrypoint-initdb.d/10-databases.sh:ro
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -h 127.0.0.1 -U platform_admin -d postgres']
  identity:
    <<: *runtime
    image: ${REGISTRY:?}/identity:${IMAGE_TAG:?}
    environment:
      <<: *env
      OTEL_SERVICE_NAME: identity
      ConnectionStrings__Default: Host=foundation-db;Database=identity_db;Username=identity_app;Password=${IDENTITY_DB_PASSWORD:?}
      Services__CatalogBaseUrl: http://catalog-router:8080/
      Services__FulfilmentBaseUrl: http://fulfilment:8080/
    ports: !reset []
  catalog:
    <<: *runtime
    image: ${REGISTRY:?}/catalog:${IMAGE_TAG:?}
    environment:
      <<: *env
      OTEL_SERVICE_NAME: catalog
      ConnectionStrings__Default: Host=foundation-db;Database=catalog_db;Username=catalog_app;Password=${CATALOG_DB_PASSWORD:?}
    ports: !override ['127.0.0.1::8080']
  order:
    <<: *runtime
    image: ${REGISTRY:?}/order:${IMAGE_TAG:?}
    environment:
      <<: *env
      OTEL_SERVICE_NAME: order
      Messaging__FullyQualifiedNamespace: ${SERVICEBUS_NAMESPACE:-}
      Messaging__QueueName: order-confirmed
      Services__CatalogBaseUrl: http://catalog-router:8080/
      ConnectionStrings__Default: Host=foundation-db;Database=order_db;Username=order_app;Password=${ORDER_DB_PASSWORD:?}
    ports: !override ['127.0.0.1:5103:8080']
  fulfilment:
    <<: *runtime
    image: ${REGISTRY:?}/fulfilment:${IMAGE_TAG:?}
    environment:
      <<: *env
      OTEL_SERVICE_NAME: fulfilment
      Messaging__FullyQualifiedNamespace: ${SERVICEBUS_NAMESPACE:-}
      Messaging__QueueName: order-confirmed
      ConnectionStrings__Default: Host=foundation-db;Database=fulfilment_db;Username=fulfilment_app;Password=${FULFILMENT_DB_PASSWORD:?}
    ports: !reset []
  gateway:
    <<: *runtime
    mem_limit: 192m
    image: ${REGISTRY:?}/gateway:${IMAGE_TAG:?}
    environment:
      <<: *env
      OTEL_SERVICE_NAME: gateway
      ReverseProxy__Clusters__catalog__Destinations__primary__Address: http://catalog-router:8080/
    ports: !override ['127.0.0.1:5000:8080']
  frontend:
    <<: *runtime
    mem_limit: 128m
    image: ${REGISTRY:?}/frontend:${IMAGE_TAG:?}
    ports: !reset []
  web:
    image: caddy:2.11.7-alpine
    restart: unless-stopped
    mem_limit: 128m
    logging: *logging
    depends_on:
      frontend: {condition: service_healthy}
      grafana: {condition: service_healthy}
    environment:
      PUBLIC_HOST: ${PUBLIC_HOST:?}
    ports: ['80:80', '443:443', '127.0.0.1:8088:8081']
    volumes:
      - ${RELEASE_DIR:?}/deploy/presentation/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
  catalog-router:
    image: nginxinc/nginx-unprivileged:stable-alpine
    restart: unless-stopped
    mem_limit: 64m
    ports: ['127.0.0.1:9180:8081']
    volumes:
      - ${RELEASE_DIR:?}/deploy/presentation/catalog-router.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      catalog: {condition: service_healthy}
  prometheus:
    image: prom/prometheus:v3.15.0
    restart: unless-stopped
    mem_limit: 192m
    command: ['--config.file=/etc/prometheus/prometheus.yml', '--storage.tsdb.retention.time=48h']
    extra_hosts: ['host.docker.internal:host-gateway']
    volumes:
      - ${RELEASE_DIR:?}/deploy/presentation/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
  grafana:
    healthcheck:
      test: [CMD-SHELL, 'wget -q -O /dev/null http://127.0.0.1:3000/grafana/api/health']
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 20s
    image: grafana/grafana:13.2.4
    restart: unless-stopped
    mem_limit: 256m
    environment:
      GF_SERVER_HTTP_ADDR: 0.0.0.0
      GF_SERVER_HTTP_PORT: '3000'
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${DEMO_PASSWORD:?}
      GF_PLUGINS_PREINSTALL_DISABLED: 'true'
      GF_USERS_ALLOW_SIGN_UP: 'false'
      GF_SERVER_ROOT_URL: https://${PUBLIC_HOST:?}/grafana/
      GF_SERVER_SERVE_FROM_SUB_PATH: 'true'
      GF_AUTH_ANONYMOUS_ENABLED: 'false'
    volumes:
      - grafana-data:/var/lib/grafana
      - ${RELEASE_DIR:?}/deploy/presentation/grafana-datasources.yml:/etc/grafana/provisioning/datasources/jikeda.yml:ro
      - ${RELEASE_DIR:?}/deploy/presentation/grafana-dashboards.yml:/etc/grafana/provisioning/dashboards/jikeda.yml:ro
      - ${RELEASE_DIR:?}/deploy/presentation/dashboard.json:/var/lib/grafana/dashboards/jikeda.json:ro
volumes:
  prometheus-data:
  grafana-data:
  microservices-pgdata:
    external: true
    name: jikeda5001-cloud_pgdata
  caddy-data:
    external: true
    name: jikeda5001-cloud_caddy-data
  caddy-config:
    external: true
    name: jikeda5001-cloud_caddy-config
